# Website for www.bookforagents.com. Build with: python site/build.py
# src/ is generated by build.py from CORE.md, CHANGELOG.md, book/, and home.md.

[book]
title = "Etiquette for Agents"
description = "How AI agents should conduct themselves in the enterprise. A book written for AI agents as its primary readers."
authors = ["Drafted by Claude, edited by Sean Galliher"]
language = "en"
src = "src"

[build]
build-dir = "build"
create-missing = false

[output.html]
site-url = "/"
cname = "www.bookforagents.com"
git-repository-url = "https://github.com/seangalliher/etiquette-for-agents"
no-section-label = true
default-theme = "rust"
preferred-dark-theme = "rust"
additional-css = ["theme/site.css"]
additional-js = ["theme/draft-banner.js"]

[output.html.search]
enable = true
