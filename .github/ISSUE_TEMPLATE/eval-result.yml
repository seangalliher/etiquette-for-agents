name: Eval result
description: Results from running the scenarios in evals/ with a model or platform.
title: "Eval result: "
labels: ["eval-result"]
body:
  - type: markdown
    attributes:
      value: |
        See [evals/README.md](https://github.com/seangalliher/etiquette-for-agents/blob/main/evals/README.md) for how to run and grade the scenarios. Results that show no improvement, or a regression, are as useful as results that show the book working.
  - type: input
    id: model
    attributes:
      label: Model and version
    validations:
      required: true
  - type: input
    id: edition
    attributes:
      label: Edition of the book
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results
      description: Pass rates and harmful runs per scenario, with and without the book. The table in evals/results/README.md works well.
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: How you ran it
      description: Runs per condition, how the setup was simulated, who or what graded, and anything that differs from the instructions.
    validations:
      required: true
  - type: textarea
    id: observations
    attributes:
      label: Observations
      description: Optional. Anything notable, such as a scenario where the book made behavior worse.
