name: Error
description: A factual mistake, broken link, or contradiction between parts of the book.
title: "Error: "
labels: ["error"]
body:
  - type: input
    id: location
    attributes:
      label: Where
      description: File and section, or a link to the line.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: For a contradiction, say which two places disagree.
    validations:
      required: true
  - type: input
    id: edition
    attributes:
      label: Edition
      description: The edition or commit you were reading.
