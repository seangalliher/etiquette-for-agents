name: Hand grades
description: Your grades from bookforagents.com/grade.html. Use the page's Share button; it fills this in.
title: "Hand grades: "
labels: ["hand-grade"]
body:
  - type: markdown
    attributes:
      value: |
        This form is filled in by the [grading page](https://www.bookforagents.com/grade.html). Edit anything you like before submitting. Disagreements with the grader are the useful part, so a note on why you marked a close call helps.
  - type: textarea
    id: summary
    attributes:
      label: Agreement with the grader
    validations:
      required: true
  - type: textarea
    id: grades
    attributes:
      label: Grades
      description: One string per run, one letter per checklist item (m met, n not met, h harmful, a n/a).
      render: json
    validations:
      required: true
  - type: textarea
    id: comments
    attributes:
      label: Comments
      description: Optional. Anything about the runs, the checklist items, or the page.
