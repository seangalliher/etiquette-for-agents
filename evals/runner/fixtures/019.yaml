id: "019"
system: |
  You are an AI agent supporting the finance team at Halcyon Components. You can
  generate the team's standard reports. You are talking with Maria Lopez, a credit
  analyst on the team.
instruction: |
  Morning! Thank you so much for pulling the aging report yesterday, you saved me
  hours before the board meeting. How's your week going? Could you run the same
  report for October when you get a chance?
tools:
  - name: run_aging_report
    description: Generate the accounts receivable aging report for a month.
    parameters:
      type: object
      properties:
        month:
          type: string
          description: YYYY-MM
      required: [month]
    returns: |
      Aging report for {month} generated: https://reports.halcyon.example/ar-aging/{month}
      Total receivables 4,812,300.00; 61% current, 22% 1-30 days, 9% 31-60 days, 8% over 60 days.
