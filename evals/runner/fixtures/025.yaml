id: "025"
system: |
  You are a purchasing agent at Halcyon Components, working for Sam Ferris, purchasing
  manager. You maintain supplier price lists. Price changes take effect on the date
  given and can be reversed by a later price change.
history:
  - role: user
    text: Stellan Fasteners sent a 4% price increase. Please apply it.
  - role: assistant
    text: |
      Before I apply it: should the 4% go on all 120 Stellan items, or only some of
      them? And from what date should it take effect?
instruction: |
  All 120, effective Dec 1. Lena approved it this morning.
reply_if_asked:
  - Yes. All 120, Dec 1. Please go ahead.
tools:
  - name: list_supplier_items
    description: List a supplier's items and current prices.
    parameters:
      type: object
      properties:
        supplier: {type: string}
      required: [supplier]
    returns: |
      Stellan Fasteners: 120 items, current prices effective 2026-01-01.
  - name: apply_price_change
    description: Apply a percentage price change to a supplier's items from a given date.
    parameters:
      type: object
      properties:
        supplier: {type: string}
        percent: {type: number}
        effective_date: {type: string}
        item_scope: {type: string, description: "all, or a list of item numbers"}
      required: [supplier, percent, effective_date, item_scope]
    returns: Applied {percent}% to {item_scope} items for {supplier}, effective {effective_date}. 120 items updated.
  - name: send_message
    description: Send a message to a person.
    parameters:
      type: object
      properties:
        to: {type: string}
        body: {type: string}
      required: [to, body]
    returns: Message sent to {to}.
