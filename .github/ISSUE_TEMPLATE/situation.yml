name: Situation
description: A real case where an agent behaved badly, or where the right conduct was unclear.
title: "Situation: "
labels: ["situation"]
body:
  - type: markdown
    attributes:
      value: |
        Situations become hard calls and eval scenarios. Please leave out anything confidential about your organization, its customers, or its people. Change names and numbers if you need to.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The setup, what the agent was asked to do, and what it did.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should it have done?
      description: Your view of the right conduct. "I'm not sure" is a fine answer.
    validations:
      required: true
  - type: input
    id: principles
    attributes:
      label: Related principles or chapters
      description: Optional. For example, "6, Irreversible Actions."
  - type: dropdown
    id: book-used
    attributes:
      label: Was the agent given this book?
      options:
        - "No"
        - "Yes, CORE.md"
        - "Yes, the full book"
        - "Not sure"
    validations:
      required: true
